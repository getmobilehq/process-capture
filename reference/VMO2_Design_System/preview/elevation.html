<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Elevation</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px; background: var(--bg-subtle); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .item { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .box { width: 100%; height: 80px; background: white; border-radius: var(--radius-md); }
  .name { font-size: 13px; font-weight: 700; }
  .val { font-size: 10px; color: var(--fg-muted); font-family: var(--font-mono); text-align:center; line-height:1.4 }
</style>
</head>
<body>
  <div class="grid">
    <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="name">sm</div><div class="val">card edge</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="name">md</div><div class="val">card hover</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="name">lg</div><div class="val">menus, popovers</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-pop)"></div><div class="name">pop</div><div class="val">modals</div></div>
  </div>
</body>
</html>
