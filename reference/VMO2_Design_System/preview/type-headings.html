<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Type — Headings</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg); }
  .item { display: grid; grid-template-columns: 1fr 180px; gap: 14px; align-items: baseline; padding: 6px 0; }
  .spec { color: var(--fg-muted); font-size: 11px; font-family: var(--font-mono); }
</style>
</head>
<body>
  <div class="item"><div class="t-h1">Connectivity that grows with you</div><span class="spec">H1 · Bold 40/1.1</span></div>
  <div class="item"><div class="t-h2">Fibre. Mobile. Cloud.</div><span class="spec">H2 · Bold 32/1.15</span></div>
  <div class="item"><div class="t-h3">A network built for British business</div><span class="spec">H3 · Bold 24/1.25</span></div>
  <div class="item"><div class="t-h4">Backed by 24/7 UK support</div><span class="spec">H4 · Medium 20/1.30</span></div>
</body>
</html>
