<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Logos</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .item { background: white; border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 14px; display:flex; flex-direction: column; align-items:center; justify-content: center; gap: 8px; min-height: 110px; }
  .item img { max-height: 60px; max-width: 100%; object-fit: contain; }
  .name { font-size: 11px; color: var(--fg-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
  .dark { background: #000; }
  .dark .name { color: rgba(255,255,255,0.65); }
</style>
</head>
<body>
  <div class="grid">
    <div class="item"><img src="../assets/logos/vmo2-logo.png" alt=""><div class="name">VMO2 corporate</div></div>
    <div class="item"><img src="../assets/logos/vmo2-business-stacked.png" alt=""><div class="name">VMO2 Business</div></div>
    <div class="item"><img src="../assets/logos/vmo2-mark.png" alt=""><div class="name">Mark only</div></div>
    <div class="item"><img src="../assets/logos/virgin-media-business.png" alt=""><div class="name">VM Business</div></div>
    <div class="item"><img src="../assets/logos/o2-business.png" alt=""><div class="name">O2 Business</div></div>
    <div class="item"><img src="../assets/logos/giffgaff.png" alt=""><div class="name">giffgaff</div></div>
  </div>
</body>
</html>
