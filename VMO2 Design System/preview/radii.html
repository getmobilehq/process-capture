<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .item { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .box { width: 84px; height: 84px; background: var(--o2-blue); }
  .name { font-size: 12px; font-weight: 700; }
  .val { font-size: 10px; color: var(--fg-muted); font-family: var(--font-mono); }
</style>
</head>
<body>
  <div class="grid">
    <div class="item"><div class="box" style="border-radius:4px"></div><div class="name">xs</div><div class="val">4px</div></div>
    <div class="item"><div class="box" style="border-radius:8px"></div><div class="name">sm</div><div class="val">8px</div></div>
    <div class="item"><div class="box" style="border-radius:14px"></div><div class="name">md</div><div class="val">14px</div></div>
    <div class="item"><div class="box" style="border-radius:24px"></div><div class="name">lg</div><div class="val">24px</div></div>
    <div class="item"><div class="box" style="border-radius:32px"></div><div class="name">xl</div><div class="val">32px</div></div>
    <div class="item"><div class="box" style="border-radius:9999px;background:var(--vmo2-pink);width:128px;height:54px"></div><div class="name">pill</div><div class="val">9999px</div></div>
  </div>
</body>
</html>
