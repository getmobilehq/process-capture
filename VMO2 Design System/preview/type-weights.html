<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aeonik Pro weights</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg); font-family: var(--font-sans); }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 4px 0; }
  .w { font-size: 11px; color: var(--fg-muted); font-family: var(--font-mono); width: 96px; }
  .s { font-size: 26px; line-height: 1.1; }
</style>
</head>
<body>
  <div class="row"><div class="w">Air · 100</div>     <div class="s" style="font-weight:100">VMO2 Business</div></div>
  <div class="row"><div class="w">Thin · 200</div>    <div class="s" style="font-weight:200">VMO2 Business</div></div>
  <div class="row"><div class="w">Light · 300</div>   <div class="s" style="font-weight:300">VMO2 Business</div></div>
  <div class="row"><div class="w">Regular · 400</div> <div class="s" style="font-weight:400">VMO2 Business</div></div>
  <div class="row"><div class="w">Medium · 500</div>  <div class="s" style="font-weight:500">VMO2 Business</div></div>
  <div class="row"><div class="w">Bold · 700</div>    <div class="s" style="font-weight:700">VMO2 Business</div></div>
  <div class="row"><div class="w">Black · 900</div>   <div class="s" style="font-weight:900">VMO2 Business</div></div>
</body>
</html>
