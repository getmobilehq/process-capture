<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Form fields</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 18px; }
  label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  input, select { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-md); font-family: inherit; font-size: 15px; box-sizing: border-box; background: white; }
  input:focus { outline: none; border-color: var(--o2-blue); box-shadow: 0 0 0 3px var(--o2-blue-20); }
  .err { color: var(--vm-red); font-size: 12px; margin-top: 4px; }
  .err input { border-color: var(--vm-red); }
  .chk { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .chk-box { width: 18px; height: 18px; border-radius: 4px; border: 2px solid var(--ink-700); display: inline-flex; align-items:center; justify-content:center; }
  .chk-box.on { background: var(--o2-blue); border-color: var(--o2-blue); color:white; }
</style>
</head>
<body>
  <div class="grid">
    <div><label>Business name</label><input value="Brewdog Ltd"></div>
    <div><label>Postcode</label><input placeholder="EH8 9JS"></div>
    <div><label>Number of employees</label><select><option>1 – 9</option><option>10 – 49</option></select></div>
    <div class="err"><label>Mobile</label><input value="070" /><div class="err">Please enter a valid UK number</div></div>
  </div>
  <div style="display:flex;gap:18px;margin-top:18px">
    <div class="chk"><span class="chk-box on">✓</span>Keep me updated</div>
    <div class="chk"><span class="chk-box"></span>Share with partners</div>
  </div>
</body>
</html>
